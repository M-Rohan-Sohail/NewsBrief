version: '3.8'

services:
  web:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/newsbrief
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-onboarding@resend.dev}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - API_URL=${API_URL:-http://localhost:8000}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-mock_client_id}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-mock_client_secret}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/static:/app/static
      - ./backend:/app

  worker:
    build: ./backend
    command: arq worker.WorkerSettings
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/newsbrief
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-onboarding@resend.dev}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - API_URL=${API_URL:-http://localhost:8000}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-mock_client_id}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-mock_client_secret}
    depends_on:
      - db
      - redis
      - web
    volumes:
      - ./backend/static:/app/static
      - ./backend:/app

  db:
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=newsbrief
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
